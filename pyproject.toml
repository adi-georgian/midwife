[project]
name = "midwife"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.63.0",
    "anthropic[vertex]>=0.40.0",
    "python-dotenv>=1.2.1",
    "fastapi>=0.115.0",
