# Render Blueprint for Midwife — a public web app (Docker) + managed Postgres.
# The web service builds our Dockerfile (FastAPI serving the API + built React SPA).
# Secrets (sync: false) are set in the Render dashboard, not committed here.
services:
  - type: web
    name: midwife
    runtime: docker
    plan: free                  # free: spins down when idle, ~cold start. Upgrade to 'starter' for always-on.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Database connection is wired automatically from the Postgres instance below.
      - key: DATABASE_URL
        fromDatabase:
          name: midwife-db
          property: connectionString
      # LLM via the public Anthropic API (Sonnet 4.6). API key set in the dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      # Optional Gemini fallback (public API). Leave unset to disable.
      - key: GEMINI_API_KEY
        sync: false
      # Clerk (open sign-up: email + Google). Secret + publishable keys and the JWT issuer
      # are set in the dashboard; the publishable key and issuer are public, secret is not.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_JWT_ISSUER
        sync: false

databases:
  - name: midwife-db
    plan: free                  # free Postgres expires after 30 days; upgrade before then.
